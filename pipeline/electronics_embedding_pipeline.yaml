# PIPELINE DEFINITION
# Name: electronics-embedding-pipeline
# Description: Electronics parts country of origin prediction using BGE-Large embeddings
# Inputs:
#    api_key: str [Default: '']
#    bucket_name: str [Default: 'pipeline']
#    data_filename: str [Default: 'synthetic_electronics_parts_1k.csv']
#    embedding_model: str [Default: '']
#    endpoint: str [Default: '']
#    minio_access_key: str [Default: '']
#    minio_endpoint: str [Default: '']
#    minio_secret_key: str [Default: '']
#    predictions_output_filename: str [Default: 'predictions_output.csv']
#    unseen_data_filename: str [Default: 'unseen_electronics_parts.csv']
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        label_encoder:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_results:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        bucket_name:
          parameterType: STRING
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        confusion_matrix_plot:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-generate-embeddings:
    executorLabel: exec-generate-embeddings
    inputDefinitions:
      artifacts:
        descriptions:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        api_key:
          parameterType: STRING
        embedding_model:
          parameterType: STRING
        endpoint:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        embeddings:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-load-and-prepare-data:
    executorLabel: exec-load-and-prepare-data
    inputDefinitions:
      parameters:
        bucket_name:
          parameterType: STRING
        data_filename:
          parameterType: STRING
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        descriptions:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        label_encoder:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        labels:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        processed_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-predict-on-unseen-data:
    executorLabel: exec-predict-on-unseen-data
    inputDefinitions:
      artifacts:
        label_encoder:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        trained_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        api_key:
          parameterType: STRING
        bucket_name:
          parameterType: STRING
        embedding_model:
          parameterType: STRING
        endpoint:
          parameterType: STRING
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        predictions_output_filename:
          parameterType: STRING
        unseen_data_filename:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        embeddings:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        label_encoder:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        labels:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        test_results:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        trained_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'matplotlib'\
          \ 'seaborn' 'scikit-learn' 'numpy' 'boto3' 'mlflow'  &&  python3 -m pip\
          \ install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    test_results: Input[Dataset],\n    label_encoder:\
          \ Input[Model],\n    minio_endpoint: str,\n    minio_access_key: str,\n\
          \    minio_secret_key: str,\n    bucket_name: str,\n    confusion_matrix_plot:\
          \ Output[Dataset],\n):\n    \"\"\"Evaluate model and generate visualizations\"\
          \"\"\n    import pickle\n    import numpy as np\n    import matplotlib\n\
          \    matplotlib.use('Agg')\n    import matplotlib.pyplot as plt\n    import\
          \ seaborn as sns\n    from sklearn.metrics import confusion_matrix, classification_report\n\
          \    import boto3\n    import os\n    import json\n\n    # --- MLflow setup\
          \ ---\n    config_str = os.environ.get('KFP_MLFLOW_CONFIG', '')\n    mlflow_run_id\
          \ = None\n    if config_str:\n        config = json.loads(config_str)\n\
          \        import mlflow\n        os.environ['MLFLOW_TRACKING_URI'] = config['endpoint']\n\
          \        os.environ['MLFLOW_TRACKING_INSECURE_TLS'] = 'true'\n        token_path\
          \ = '/var/run/secrets/kubernetes.io/serviceaccount/token'\n        if os.path.exists(token_path):\n\
          \            with open(token_path) as f:\n                os.environ['MLFLOW_TRACKING_TOKEN']\
          \ = f.read().strip()\n        mlflow_run_id = config.get('parentRunId')\n\
          \        print(f\"[MLflow] Connected, run_id={mlflow_run_id}\")\n\n    #\
          \ Load test results and label encoder\n    with open(test_results.path,\
          \ \"rb\") as f:\n        test_data = pickle.load(f)\n\n    with open(label_encoder.path,\
          \ \"rb\") as f:\n        label_encoder_obj = pickle.load(f)\n\n    y_test\
          \ = np.array(test_data[\"y_test\"])\n    y_pred = np.array(test_data[\"\
          y_pred\"])\n    accuracy = test_data[\"accuracy\"]\n\n    class_names =\
          \ label_encoder_obj.classes_\n\n    print(f\"Model Performance:\")\n   \
          \ print(f\"   - Accuracy: {accuracy:.1%}\")\n\n    # Show detailed results\n\
          \    print(\"\\nDetailed Classification Report:\")\n    report_str = classification_report(y_test,\
          \ y_pred, target_names=class_names)\n    print(report_str)\n\n    # Setup\
          \ MinIO client\n    s3_client = boto3.client(\n        \"s3\",\n       \
          \ endpoint_url=minio_endpoint,\n        aws_access_key_id=minio_access_key,\n\
          \        aws_secret_access_key=minio_secret_key,\n        verify=False,\n\
          \    )\n\n    artifacts_for_mlflow = []\n\n    # Create confusion matrix\n\
          \    if len(class_names) > 1:\n        cm = confusion_matrix(y_test, y_pred)\n\
          \n        # --- Confusion matrix heatmap ---\n        plt.figure(figsize=(10,\
          \ 8))\n        sns.heatmap(\n            cm,\n            annot=True,\n\
          \            fmt=\"d\",\n            cmap=\"Blues\",\n            xticklabels=class_names,\n\
          \            yticklabels=class_names,\n        )\n        plt.title(\"Confusion\
          \ Matrix - Country of Origin Prediction\")\n        plt.xlabel(\"Predicted\
          \ Country\")\n        plt.ylabel(\"Actual Country\")\n        plt.xticks(rotation=45,\
          \ ha='right')\n        plt.tight_layout()\n\n        local_plot_path = \"\
          /tmp/confusion_matrix.png\"\n        plt.savefig(local_plot_path, dpi=150,\
          \ bbox_inches=\"tight\")\n        plt.savefig(confusion_matrix_plot.path,\
          \ dpi=150, bbox_inches=\"tight\")\n        plt.close()\n        artifacts_for_mlflow.append(local_plot_path)\n\
          \n        # --- Normalized confusion matrix ---\n        cm_norm = cm.astype('float')\
          \ / cm.sum(axis=1)[:, np.newaxis]\n        plt.figure(figsize=(10, 8))\n\
          \        sns.heatmap(\n            cm_norm,\n            annot=True,\n \
          \           fmt=\".2f\",\n            cmap=\"YlOrRd\",\n            xticklabels=class_names,\n\
          \            yticklabels=class_names,\n        )\n        plt.title(\"Normalized\
          \ Confusion Matrix\")\n        plt.xlabel(\"Predicted Country\")\n     \
          \   plt.ylabel(\"Actual Country\")\n        plt.xticks(rotation=45, ha='right')\n\
          \        plt.tight_layout()\n\n        norm_plot_path = \"/tmp/confusion_matrix_normalized.png\"\
          \n        plt.savefig(norm_plot_path, dpi=150, bbox_inches=\"tight\")\n\
          \        plt.close()\n        artifacts_for_mlflow.append(norm_plot_path)\n\
          \n        # --- Per-class accuracy bar chart ---\n        report_dict =\
          \ classification_report(y_test, y_pred, target_names=class_names, output_dict=True)\n\
          \        per_class_f1 = [report_dict[c][\"f1-score\"] for c in class_names]\n\
          \        per_class_prec = [report_dict[c][\"precision\"] for c in class_names]\n\
          \        per_class_rec = [report_dict[c][\"recall\"] for c in class_names]\n\
          \n        fig, ax = plt.subplots(figsize=(12, 6))\n        x = np.arange(len(class_names))\n\
          \        width = 0.25\n        ax.bar(x - width, per_class_prec, width,\
          \ label='Precision', color='#2196F3')\n        ax.bar(x, per_class_rec,\
          \ width, label='Recall', color='#FF9800')\n        ax.bar(x + width, per_class_f1,\
          \ width, label='F1-Score', color='#4CAF50')\n        ax.set_xlabel('Country')\n\
          \        ax.set_ylabel('Score')\n        ax.set_title('Per-Class Precision\
          \ / Recall / F1')\n        ax.set_xticks(x)\n        ax.set_xticklabels(class_names,\
          \ rotation=45, ha='right')\n        ax.legend()\n        ax.set_ylim(0,\
          \ 1.05)\n        ax.grid(axis='y', alpha=0.3)\n        plt.tight_layout()\n\
          \n        bar_plot_path = \"/tmp/per_class_metrics.png\"\n        plt.savefig(bar_plot_path,\
          \ dpi=150, bbox_inches=\"tight\")\n        plt.close()\n        artifacts_for_mlflow.append(bar_plot_path)\n\
          \n        # Upload to MinIO\n        s3_client.upload_file(local_plot_path,\
          \ bucket_name, \"outputs/confusion_matrix.png\")\n        print(\"Confusion\
          \ matrix saved to MinIO\")\n\n    # Save evaluation report to MinIO\n  \
          \  local_report_path = \"/tmp/evaluation_report.txt\"\n    with open(local_report_path,\
          \ \"w\") as f:\n        f.write(f\"Model Performance:\\n\")\n        f.write(f\"\
          Accuracy: {accuracy:.1%}\\n\\n\")\n        f.write(\"Detailed Classification\
          \ Report:\\n\")\n        f.write(report_str)\n    artifacts_for_mlflow.append(local_report_path)\n\
          \n    s3_client.upload_file(\n        local_report_path, bucket_name, \"\
          outputs/evaluation_report.txt\"\n    )\n\n    # --- MLflow logging ---\n\
          \    if mlflow_run_id:\n        import mlflow\n        with mlflow.start_run(run_id=mlflow_run_id):\n\
          \            for artifact_path in artifacts_for_mlflow:\n              \
          \  mlflow.log_artifact(artifact_path, \"evaluation\")\n\n            mlflow.set_tag(\"\
          pipeline_step\", \"evaluate_model\")\n\n        print(f\"[MLflow] Logged\
          \ {len(artifacts_for_mlflow)} evaluation artifacts\")\n\n    print(\"Evaluation\
          \ complete - results saved to MinIO outputs folder\")\n\n"
        image: registry.redhat.io/ubi8/python-39:latest
    exec-generate-embeddings:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_embeddings
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy' 'python-dotenv'\
          \ 'requests' 'mlflow'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_embeddings(\n    descriptions: Input[Dataset],\n   \
          \ endpoint: str,\n    embedding_model: str,\n    api_key: str,\n    embeddings:\
          \ Output[Dataset],\n):\n    \"\"\"Generate embeddings using vLLM BGE-Large\
          \ model\"\"\"\n    import pickle\n    import numpy as np\n    import requests\n\
          \    import json\n    import os\n    import time\n\n    # --- MLflow setup\
          \ ---\n    config_str = os.environ.get('KFP_MLFLOW_CONFIG', '')\n    mlflow_run_id\
          \ = None\n    if config_str:\n        config = json.loads(config_str)\n\
          \        import mlflow\n        os.environ['MLFLOW_TRACKING_URI'] = config['endpoint']\n\
          \        os.environ['MLFLOW_TRACKING_INSECURE_TLS'] = 'true'\n        token_path\
          \ = '/var/run/secrets/kubernetes.io/serviceaccount/token'\n        if os.path.exists(token_path):\n\
          \            with open(token_path) as f:\n                os.environ['MLFLOW_TRACKING_TOKEN']\
          \ = f.read().strip()\n        mlflow_run_id = config.get('parentRunId')\n\
          \        print(f\"[MLflow] Connected, run_id={mlflow_run_id}\")\n\n    #\
          \ Load descriptions\n    with open(descriptions.path, \"rb\") as f:\n  \
          \      descriptions_list = pickle.load(f)\n\n    print(f\"Generating embeddings\
          \ for {len(descriptions_list)} descriptions...\")\n\n    # Create embeddings\
          \ via API call\n    headers = {\"Authorization\": f\"Bearer {api_key}\"\
          , \"Content-Type\": \"application/json\"}\n\n    embeddings_list = []\n\
          \    latencies = []\n\n    start_total = time.time()\n    for i, desc in\
          \ enumerate(descriptions_list):\n        payload = {\"model\": embedding_model,\
          \ \"input\": desc}\n\n        t0 = time.time()\n        response = requests.post(\n\
          \            f\"{endpoint}/v1/embeddings\", headers=headers, json=payload,\
          \ verify=False\n        )\n        latencies.append(time.time() - t0)\n\n\
          \        if response.status_code == 200:\n            result = response.json()\n\
          \            embedding = result[\"data\"][0][\"embedding\"]\n          \
          \  embeddings_list.append(embedding)\n        else:\n            print(f\"\
          Error generating embedding: {response.status_code}\")\n            raise\
          \ Exception(f\"Failed to generate embedding for: {desc[:50]}...\")\n\n \
          \       if (i + 1) % 100 == 0:\n            print(f\"  Processed {i+1}/{len(descriptions_list)}\
          \ embeddings...\")\n\n    total_time = time.time() - start_total\n\n   \
          \ if embeddings_list:\n        X = np.array(embeddings_list)\n        print(f\"\
          Generated embeddings with shape: {X.shape}\")\n\n        # --- MLflow logging\
          \ ---\n        if mlflow_run_id:\n            import mlflow\n          \
          \  with mlflow.start_run(run_id=mlflow_run_id):\n                mlflow.log_params({\n\
          \                    \"embedding_model\": embedding_model,\n           \
          \         \"embedding_endpoint\": endpoint.split(\"//\")[-1].split(\".\"\
          )[0],\n                })\n                mlflow.log_metrics({\n      \
          \              \"embeddings/num_samples\": len(embeddings_list),\n     \
          \               \"embeddings/dimension\": X.shape[1],\n                \
          \    \"embeddings/total_time_sec\": round(total_time, 2),\n            \
          \        \"embeddings/avg_latency_ms\": round(np.mean(latencies) * 1000,\
          \ 2),\n                    \"embeddings/p50_latency_ms\": round(np.median(latencies)\
          \ * 1000, 2),\n                    \"embeddings/p95_latency_ms\": round(np.percentile(latencies,\
          \ 95) * 1000, 2),\n                    \"embeddings/p99_latency_ms\": round(np.percentile(latencies,\
          \ 99) * 1000, 2),\n                    \"embeddings/throughput_per_sec\"\
          : round(len(embeddings_list) / total_time, 2),\n                    \"embeddings/mean_norm\"\
          : round(float(np.linalg.norm(X, axis=1).mean()), 4),\n                 \
          \   \"embeddings/std_norm\": round(float(np.linalg.norm(X, axis=1).std()),\
          \ 4),\n                })\n                mlflow.set_tag(\"pipeline_step\"\
          , \"generate_embeddings\")\n            print(\"[MLflow] Logged embedding\
          \ metrics and latencies\")\n\n        # Save embeddings\n        with open(embeddings.path,\
          \ \"wb\") as f:\n            pickle.dump(X, f)\n\n        print(\"Embeddings\
          \ saved\")\n    else:\n        raise Exception(\"Failed to generate embeddings\"\
          )\n\n"
        image: registry.redhat.io/ubi8/python-39:latest
    exec-load-and-prepare-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_and_prepare_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ 'scikit-learn' 'python-dotenv' 'boto3' 'mlflow'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_and_prepare_data(\n    minio_endpoint: str,\n    minio_access_key:\
          \ str,\n    minio_secret_key: str,\n    bucket_name: str,\n    data_filename:\
          \ str,\n    processed_data: Output[Dataset],\n    label_encoder: Output[Model],\n\
          \    labels: Output[Dataset],\n    descriptions: Output[Dataset],\n):\n\
          \    \"\"\"Load and prepare data for the embedding pipeline\"\"\"\n    import\
          \ pandas as pd\n    import numpy as np\n    from sklearn.preprocessing import\
          \ LabelEncoder\n    import pickle\n    import boto3\n    import os\n   \
          \ import json\n\n    # --- MLflow setup ---\n    config_str = os.environ.get('KFP_MLFLOW_CONFIG',\
          \ '')\n    mlflow_run_id = None\n    if config_str:\n        config = json.loads(config_str)\n\
          \        import mlflow\n        os.environ['MLFLOW_TRACKING_URI'] = config['endpoint']\n\
          \        os.environ['MLFLOW_TRACKING_INSECURE_TLS'] = 'true'\n        token_path\
          \ = '/var/run/secrets/kubernetes.io/serviceaccount/token'\n        if os.path.exists(token_path):\n\
          \            with open(token_path) as f:\n                os.environ['MLFLOW_TRACKING_TOKEN']\
          \ = f.read().strip()\n        mlflow_run_id = config.get('parentRunId')\n\
          \        print(f\"[MLflow] Connected, run_id={mlflow_run_id}\")\n\n    #\
          \ Setup MinIO client\n    s3_client = boto3.client(\n        \"s3\",\n \
          \       endpoint_url=minio_endpoint,\n        aws_access_key_id=minio_access_key,\n\
          \        aws_secret_access_key=minio_secret_key,\n        verify=False,\n\
          \    )\n\n    # Download data from MinIO\n    local_data_path = \"/tmp/input_data.csv\"\
          \n    s3_client.download_file(bucket_name, f\"data/{data_filename}\", local_data_path)\n\
          \n    # Load the synthetic electronics data\n    df = pd.read_csv(local_data_path)\n\
          \n    print(f\"Loaded {len(df)} records from MinIO bucket {bucket_name}\"\
          )\n    print(f\"Columns: {list(df.columns)}\")\n\n    # Prepare labels\n\
          \    label_encoder_obj = LabelEncoder()\n    y = label_encoder_obj.fit_transform(df[\"\
          Country_Of_Origin\"])\n    class_names = label_encoder_obj.classes_\n\n\
          \    print(f\"Number of countries: {len(class_names)}\")\n    print(f\"\
          Countries: {list(class_names)}\")\n\n    # --- MLflow logging ---\n    if\
          \ mlflow_run_id:\n        import mlflow\n        with mlflow.start_run(run_id=mlflow_run_id):\n\
          \            mlflow.log_params({\n                \"data_filename\": data_filename,\n\
          \                \"bucket_name\": bucket_name,\n                \"minio_endpoint\"\
          : minio_endpoint.split(\"//\")[-1],\n            })\n            mlflow.log_metrics({\n\
          \                \"dataset/num_records\": len(df),\n                \"dataset/num_features\"\
          : len(df.columns),\n                \"dataset/num_classes\": len(class_names),\n\
          \            })\n\n            class_dist = df[\"Country_Of_Origin\"].value_counts()\n\
          \            for country, count in class_dist.items():\n               \
          \ safe_name = str(country).replace(\" \", \"_\").replace(\".\", \"\")[:50]\n\
          \                mlflow.log_metric(f\"dataset/class_{safe_name}\", count)\n\
          \n            mlflow.set_tags({\n                \"pipeline_step\": \"load_and_prepare_data\"\
          ,\n                \"dataset_columns\": \", \".join(df.columns.tolist()),\n\
          \            })\n\n            local_data_path_copy = \"/tmp/dataset_sample.csv\"\
          \n            df.head(50).to_csv(local_data_path_copy, index=False)\n  \
          \          mlflow.log_artifact(local_data_path_copy, \"data\")\n\n     \
          \   print(\"[MLflow] Logged dataset params and metrics\")\n\n    # Save\
          \ processed data and encoder\n    df.to_csv(processed_data.path, index=False)\n\
          \n    with open(label_encoder.path, \"wb\") as f:\n        pickle.dump(label_encoder_obj,\
          \ f)\n\n    with open(labels.path, \"wb\") as f:\n        pickle.dump(y,\
          \ f)\n\n    # Save descriptions for embedding generation\n    descriptions_list\
